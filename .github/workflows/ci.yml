name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The changed-line coverage gate diffs against the base branch, which a
          # shallow clone does not contain. Depth 0 fetches with
          # +refs/heads/*:refs/remotes/origin/*, so the base is already a local
          # remote-tracking ref and the gate needs no second, unauthenticated fetch.
          #
          # Deliberately unconditional, though the gate runs on pull requests only.
          # Measured on this repository: the full-history checkout takes 2.66s in a 325s
          # job, and a conditional would save only the depth-0-versus-depth-1 difference,
          # on merges to main. Against that, the obvious expression
          # ${{ github.event_name == 'pull_request' && 0 || 1 }} always yields 1, because
          # 0 is falsy here, which would give every pull request a shallow clone and turn
          # the gate into a silent no-op on exactly the runs it exists for.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install Go for actionlint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0

      - name: Check justfile formatting
        run: just lint-just

      # Vale is installed here rather than by an action so that CI runs `just prose-lint` itself.
      # The action took its own copy of the file list, and the two diverged: CI stopped linting
      # CONTRIBUTING.md, AGENTS.md and the pull request template while a contributor's local run
      # kept checking them, which is a gate that disagrees with itself. One definition now, in the
      # justfile, which is also what `just check` runs. Pinned and checksummed because this is a
      # binary fetched at build time.
      #
      # What is lost by not using the action: inline review annotations from reviewdog. Failures
      # appear in the step log instead.
      - name: Install Vale
        env:
          VALE_VERSION: 3.17.1
          VALE_SHA256: db947f89f2292e6a0381a61de155f6a5f5cb4cb460ca178ea412ef605559cefd
        run: |
          set -euo pipefail
          archive="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/${archive}"
          echo "${VALE_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" vale
          install -m 0755 vale /usr/local/bin/vale
          rm -f "$archive" vale
          vale --version

      - name: Lint maintained prose
        run: just prose-lint

      - name: Verify the prose-lint gate can fail
        run: just test-prose-lint-exit

      - name: Bootstrap development environment
        run: just bootstrap

      - name: Verify idempotent bootstrap
        run: |
          just bootstrap
          git diff --exit-code

      - name: Lint rendered Bash recipes
        run: just shellcheck

      - name: Lint GitHub Actions workflows
        run: just actionlint

      - name: Lint
        run: just lint

      - name: Audit Python dependencies
        run: just deps-lint

      - name: Typecheck
        run: just typecheck

      # In `just check` since it was written, and never in CI, so a stale schema artifact could
      # merge while a local run refused it. That drift is https://github.com/microbiomedata/nmdc-lakehouse/issues/290.
      - name: Check the committed flat schema matches current generation
        run: just check-flat-schema

      - name: Check doc procedures declare whether anyone ran them
        run: just doc-procedures

      - name: Verify the doc-procedure gate can fail
        run: just test-doc-procedures-exit

      - name: Check CI runs every gate `just check` runs
        run: just ci-gate-parity

      - name: Verify the gate-parity check can fail
        run: just test-ci-gate-parity-exit

      - name: Test
        run: just test-cov

      - name: Verify coverage report
        run: test -s coverage.xml

      # Pull requests only. On a push to main GITHUB_BASE_REF is empty, so the gate would compare
      # origin/main against main, find no lines, and report a pass having checked nothing. A gate
      # that cannot fail is worse than an absent one, because the green tick claims otherwise.
      - name: Gate changed lines on coverage
        if: github.event_name == 'pull_request'
        run: just diff-cover "origin/${GITHUB_BASE_REF}"

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python-3.13
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Smoke-test documented commands
        run: |
          just --summary
          just cli --help
          uv run python scripts/flatten_nmdc_collections.py --help
          uv run python scripts/export_duckdb_to_parquet.py --help

      - name: Build and test distributions
        run: just test-dist

      - name: Build documentation
        run: just docs-build

  linkcheck:
    name: linkcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check links in docs
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --exclude '^https://(iris|sshproxy)\.nersc\.gov/'
            README.md scripts/README.md docs notebooks/*.md
          # NERSC's IRIS and sshproxy services time out or return errors to
          # unauthenticated CI requests. Keep those exceptions explicit; every
          # other internal or external failure blocks the PR.
          fail: true
        env:
          # Authenticated requests to github.com avoid the unauthenticated
          # rate limit that otherwise makes this job flaky on busy days.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
