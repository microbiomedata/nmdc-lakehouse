name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0

      - name: Check justfile formatting
        run: just lint-just

      - name: Lint maintained prose
        uses: vale-cli/vale-action@85f9f7f2c5f449ac0ae5b66662961bae3f77ca6a # v2.1.2
        with:
          version: 3.17.1
          files: '["README.md", "docs", "scripts/README.md", "notebooks"]'
          filter_mode: nofilter
          fail_on_error: true
          level: error

      - name: Install dependencies
        run: uv sync --extra dev --extra docs

      - name: Lint
        run: just lint

      - name: Typecheck
        run: just typecheck

      - name: Test
        run: just test

      - name: Smoke-test documented commands
        run: |
          just --summary
          just cli --help
          uv run python scripts/flatten_nmdc_collections.py --help
          uv run python scripts/export_duckdb_to_parquet.py --help

      - name: Build documentation
        run: just docs-build

  linkcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check links in docs
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --exclude '^https://(iris|sshproxy)\.nersc\.gov/'
            README.md scripts/README.md docs notebooks/*.md
          # NERSC's IRIS and sshproxy services time out or return errors to
          # unauthenticated CI requests. Keep those exceptions explicit; every
          # other internal or external failure blocks the PR.
          fail: true
        env:
          # Authenticated requests to github.com avoid the unauthenticated
          # rate limit that otherwise makes this job flaky on busy days.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
