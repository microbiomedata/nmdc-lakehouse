name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # doc-references-issues reads issue state through gh. The repository is public, so this grants
  # nothing the token could not already see; it is here so the step does not depend on that.
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The changed-line coverage gate diffs against the base branch, which a
          # shallow clone does not contain. Depth 0 fetches with
          # +refs/heads/*:refs/remotes/origin/*, so the base is already a local
          # remote-tracking ref and the gate needs no second, unauthenticated fetch.
          #
          # Deliberately unconditional, though the gate runs on pull requests only.
          # Measured on this repository: the full-history checkout takes 2.66s in a 325s
          # job, and a conditional would save only the depth-0-versus-depth-1 difference,
          # on merges to main. Against that, the obvious expression
          # ${{ github.event_name == 'pull_request' && 0 || 1 }} always yields 1, because
          # 0 is falsy here, which would give every pull request a shallow clone and turn
          # the gate into a silent no-op on exactly the runs it exists for.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install Go for actionlint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0

      # Vale is installed here rather than by an action so that CI runs `just prose-lint` itself.
      # The action took its own copy of the file list, and the two diverged: CI stopped linting
      # CONTRIBUTING.md, AGENTS.md and the pull request template while a contributor's local run
      # kept checking them, which is a gate that disagrees with itself. One definition now, in the
      # justfile, which is also what `just check` runs. Pinned and checksummed because this is a
      # binary fetched at build time.
      #
      # What is lost by not using the action: inline review annotations from reviewdog. Failures
      # appear in the step log instead.
      - name: Install Vale
        env:
          VALE_VERSION: 3.17.1
          VALE_SHA256: db947f89f2292e6a0381a61de155f6a5f5cb4cb460ca178ea412ef605559cefd
        run: |
          set -euo pipefail
          archive="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/${archive}"
          echo "${VALE_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" vale
          install -m 0755 vale /usr/local/bin/vale
          rm -f "$archive" vale
          vale --version

      - name: Bootstrap development environment
        run: just bootstrap

      - name: Verify idempotent bootstrap
        run: |
          just bootstrap
          git diff --exit-code

      # One step, running the one recipe that owns the list. These gates used to be enumerated
      # here as well as in `just check`, so the two lists were maintained by hand and drifted
      # twice: CI silently stopped linting CONTRIBUTING.md, and a gate added in PR 319 was inert
      # here until review caught it. There is nothing to keep in sync now.
      #
      # What this costs is the per-step timing and the named failing step in the UI. The log names
      # the recipe that failed, and `just check` runs the same recipes in the same order a
      # contributor runs locally, which is worth more than the timeline.
      - name: Check
        run: just check

      - name: Verify coverage report
        run: test -s coverage.xml

      # Queries GitHub, which is why it is not in `just check`: a network failure there would fail
      # an unrelated change on a developer's machine, possibly offline. In CI the same query runs
      # against the same GitHub that is hosting the pull request, and a failed run is re-runnable.
      - name: Check doc references do not point at closed issues
        run: just doc-references-issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the closed-issue gate can fail
        run: just test-doc-references-issues-exit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python-3.13
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Smoke-test documented commands
        run: |
          just --summary
          just cli --help
          uv run python scripts/flatten_nmdc_collections.py --help
          uv run python scripts/export_duckdb_to_parquet.py --help

      - name: Build and test distributions
        run: just test-dist

      - name: Build documentation
        run: just docs-build

  linkcheck:
    name: linkcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check links in docs
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --exclude '^https://(iris|sshproxy)\.nersc\.gov/'
            README.md scripts/README.md docs notebooks/*.md
          # NERSC's IRIS and sshproxy services time out or return errors to
          # unauthenticated CI requests. Keep those exceptions explicit; every
          # other internal or external failure blocks the PR.
          fail: true
        env:
          # Authenticated requests to github.com avoid the unauthenticated
          # rate limit that otherwise makes this job flaky on busy days.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
