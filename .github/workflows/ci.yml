name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The changed-line coverage gate diffs against the base branch, which a
          # shallow clone does not contain. Depth 0 fetches with
          # +refs/heads/*:refs/remotes/origin/*, so the base is already a local
          # remote-tracking ref and the gate needs no second, unauthenticated fetch.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install Go for actionlint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0

      - name: Check justfile formatting
        run: just lint-just

      - name: Lint maintained prose
        uses: vale-cli/vale-action@85f9f7f2c5f449ac0ae5b66662961bae3f77ca6a # v2.1.2
        with:
          version: 3.17.1
          # Same set as `just prose-lint`. They diverged, so CI never linted CONTRIBUTING.md,
          # AGENTS.md or this repository's pull request template while a contributor's local
          # run did, which is a gate that disagrees with itself.
          files: '["README.md", "CONTRIBUTING.md", "AGENTS.md", ".github/pull_request_template.md", "docs", "scripts/README.md", "notebooks"]'
          vale_flags: "--glob=**/*.md"
          filter_mode: nofilter
          fail_on_error: true
          # `level:` is deliberately absent. At this pinned SHA the action never reads it: it
          # computes reviewdog's -level from Vale's own exit code. Passing `level: error` was
          # inert, and its presence is what convinced two readers that a severity threshold
          # existed. Confirmed from the logged invocation of a failing run, which shows
          # -level=info while the input said error.

      - name: Bootstrap development environment
        run: just bootstrap

      - name: Verify idempotent bootstrap
        run: |
          just bootstrap
          git diff --exit-code

      - name: Lint rendered Bash recipes
        run: just shellcheck

      - name: Lint GitHub Actions workflows
        run: just actionlint

      - name: Lint
        run: just lint

      - name: Audit Python dependencies
        run: just deps-lint

      - name: Typecheck
        run: just typecheck

      - name: Test
        run: just test-cov

      - name: Verify coverage report
        run: test -s coverage.xml

      # Pull requests only. On a push to main GITHUB_BASE_REF is empty, so the gate would compare
      # origin/main against main, find no lines, and report a pass having checked nothing. A gate
      # that cannot fail is worse than an absent one, because the green tick claims otherwise.
      - name: Gate changed lines on coverage
        if: github.event_name == 'pull_request'
        run: just diff-cover "origin/${GITHUB_BASE_REF}"

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python-3.13
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Smoke-test documented commands
        run: |
          just --summary
          just cli --help
          uv run python scripts/flatten_nmdc_collections.py --help
          uv run python scripts/export_duckdb_to_parquet.py --help

      - name: Build and test distributions
        run: just test-dist

      - name: Build documentation
        run: just docs-build

  linkcheck:
    name: linkcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check links in docs
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --exclude '^https://(iris|sshproxy)\.nersc\.gov/'
            README.md scripts/README.md docs notebooks/*.md
          # NERSC's IRIS and sshproxy services time out or return errors to
          # unauthenticated CI requests. Keep those exceptions explicit; every
          # other internal or external failure blocks the PR.
          fail: true
        env:
          # Authenticated requests to github.com avoid the unauthenticated
          # rate limit that otherwise makes this job flaky on busy days.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
