# Enforces the audience half of the issue and pull request rules: a reader who was
# not there has to be able to resolve every term.
#
# Vale matches text that is present, and missing context is text that is absent,
# which looks unreachable. The conditional extension is the way around it: if the
# first pattern matches, the second must match somewhere in the same file. So
# "ACRONYM appears" implies "(ACRONYM) appears", which is what an expansion on
# first use looks like.
#
# Anything in the NMDC vocabulary is exempt automatically. Verified against Vale
# 3.17.1 on 2026-08-20: BERDL matches the pattern and never fires, because it is
# listed in .github/styles/config/vocabularies/NMDC/accept.txt. Use that file for a
# project term that genuinely needs no expansion, and the list below only for
# vocabulary any reader here already has.
#
# A mixed-case term such as LinkML is exempt for a different reason and is not
# evidence about the vocabulary at all: [A-Z]{3,6} cannot match it in the first
# place. An earlier version of this comment cited LinkML as a vocabulary exemption,
# which attributed the wrong cause to a correct observation. Flagged by Copilot on
# https://github.com/microbiomedata/nmdc-lakehouse/pull/265. If you need to know
# whether the vocabulary is doing the work, test with an all-caps term.
#
# EVERY EXCEPTION IS QUOTED ON PURPOSE. Vale's YAML parser reads a bare NULL as
# null rather than a string, which makes the whole exceptions list fail to
# unmarshal, and Vale then drops the rule and reports a clean pass with no error
# and no warning. That cost an hour on 2026-08-20 and produced two separate
# "measured zero hits" results that were really "the rule was not running".
# Bare TRUE, FALSE and YES happen to survive, because Go's parser treats only
# lowercase as booleans, but quoting all of them removes the distinction as
# something anyone has to remember.
#
# This rule is deliberately not blocking, because the all-caps pattern cannot tell an
# acronym from a shouted word or a SQL keyword, and the list below is
# necessarily incomplete.
#
# Run `just prose-lint` after editing, and check the rule still reports what you
# expect on a file you know violates it. A conditional rule that silently stops
# matching still reports a clean pass, which is worse than having no rule,
# because it looks like evidence.
# Severity is NOT set here. It is set per rule in .vale.ini, which is this repository's
# policy and the single place to change it. A `level:` key in this file would duplicate that
# and drift from it. Flagged by Copilot on
# https://github.com/microbiomedata/nmdc-lakehouse/pull/265.
# WHY THIS IS NOT A SCRIPT RULE, decided 2026-08-21 after building one and measuring it.
#
# This rule checks that a parenthesised copy of the acronym exists somewhere in the file. It does
# not check that anything was expanded, so `The SPQR pipeline (SPQR) ran.` satisfies it. Closing
# that needs the words before the parenthesis to begin with the letters inside it, which is a
# backreference, and Go's RE2 has none.
#
# Vale's `script` extension does have the expressiveness. Confirmed working on 3.17.1, which CI
# pins, as well as on 3.18.0. So the mechanism was never the obstacle. The matching rule is.
#
# A script rule doing strict initial-letter matching was written and tested. It fires correctly on
# `The SPQR pipeline (SPQR) ran.`, which is the gap. It also fires on genuine expansions:
#
#   Senate and People of Rome (SPQR)          S-a-P-o-R. SPQR is Senatus Populusque Romanus,
#                                             and its Q comes from the enclitic -que inside the
#                                             second word, not from any word initial at all
#   NERSC multi-factor authentication (MFA)   "multi-factor" is one word covering two letters
#
# The second is the only real expansion in this repository's maintained prose, and initial matching
# rejects it. Latin origins, hyphenated compounds and dropped stopwords all break the rule, so the
# fix trades false negatives for false positives on correct writing. A non-blocking rule that flags
# correct prose is worse than one that misses cases, because it teaches people to ignore it.
#
# Accepted as a known gap. The message below now says what is actually checked, that no
# parenthesised form appears anywhere in the file, rather than claiming nothing was expanded, which
# is the thing this rule cannot tell. Issue 272 said the message had already been narrowed; it had
# not, and repeating that without opening the file is how the wrong claim survived into this
# comment. Reopen only with a mechanism that handles the two cases above.
# See https://github.com/microbiomedata/nmdc-lakehouse/issues/272.
extends: conditional
message: "'%s' has no parenthesised form anywhere in this file. Expand it on first use, or add it to the vocabulary if it needs none."
scope: text
ignorecase: false
first: '\b([A-Z]{3,6})\b'
second: '\(([A-Z]{3,6})\)'
exceptions:
  # Generic technical vocabulary. A reader in this field has these already, so
  # demanding an expansion adds noise instead of reach. Project-specific terms
  # deliberately stay out: those are the ones a new reader cannot resolve.
  - 'API'
  - 'AWS'
  - 'CLI'
  - 'CPU'
  - 'CSS'
  - 'CSV'
  - 'DDNS'
  - 'DNS'
  - 'ETL'
  - 'GCP'
  - 'GPU'
  - 'HTML'
  - 'HTTP'
  - 'HTTPS'
  - 'IDE'
  - 'ISO'
  - 'JSON'
  - 'JVM'
  - 'JWT'
  - 'LAN'
  - 'MFA'
  - 'PDF'
  - 'PNG'
  - 'RAM'
  - 'REST'
  - 'RFC'
  - 'SDK'
  - 'SHA'
  - 'SOCKS'
  - 'SQL'
  - 'SSH'
  - 'SSL'
  - 'SSO'
  - 'TLS'
  - 'TSV'
  - 'URI'
  - 'URL'
  - 'UTC'
  - 'UUID'
  - 'VPN'
  - 'WAN'
  - 'XML'
  - 'YAML'
  - 'HEAD'
  - 'OTP'
  - 'PEP'
  - 'PID'
  - 'README'
  - 'TCP'
  - 'WITH'
  - 'BFS'
  - 'CTE'
  - 'DDL'
  - 'DML'
  - 'FTP'
  - 'INFO'
  - 'JOIN'
  - 'MIT'
  - 'WSL'
  - 'LIMIT'
  - 'NOW'
  - 'OFFSET'
  - 'TOTP'
  # Words the all-caps pattern cannot tell from an acronym: English words used
  # for emphasis, SQL keywords, and the state labels labctl prints.
  - 'ALL'
  - 'AND'
  - 'ANY'
  - 'ARRAY'
  - 'CAN'
  - 'DOWN'
  - 'FALSE'
  - 'FIX'
  - 'FROM'
  - 'GET'
  - 'NEW'
  - 'NOT'
  - 'NOTE'
  - 'NULL'
  - 'OLD'
  - 'PUT'
  - 'RUN'
  - 'SELECT'
  - 'SET'
  - 'TODO'
  - 'TRUE'
  - 'WARN'
  - 'WHERE'
  - 'YES'
