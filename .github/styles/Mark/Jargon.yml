# Severity is NOT set here. It is set per rule in .vale.ini, which is this repository's
# policy and the single place to change it. A `level:` key in this file would duplicate that
# and drift from it. Flagged by Copilot on
# https://github.com/microbiomedata/nmdc-lakehouse/pull/265.
extends: substitution
message: "House style: use '%s' instead of '%s'."
ignorecase: true
swap:
  footgun: easy to misuse
  'hoist(ing|ed)?': move up
  'hot[- ]path': performance shortcut
  'surface area': scope
  delve: go into
  'leverages?': use
  robust: reliable
  seamless: smooth
  'under the hood': internally
  'out of the box': by default
  boilerplate: repeated setup
  idiomatic: conventional
  ergonomic: easy to use
