# The same requirement, for the form its sibling rule cannot see.
#
# Mark/BareRef.yml matches '#\d{2,}' only. That misses the way these references are actually
# written most of the time: "PR 3366", "issue 2950", "pull request 3230", with no hash at all.
# Measured 2026-08-14 across the desktop markdown written that day: BareRef fired 7 times on a
# file containing 30 bare references of this form.
#
# Precision here is much better than for the hash form, because the false-positive cases that
# forced BareRef down to warning do not arise. There is no "see PR #10 above" equivalent: an
# internal cross-reference is written "item 10" or "section 3", not "PR 10", and rule and section
# numbering does not use the words PR, issue or pull request.
#
# The line-level URL exclusion is deliberately not attempted here. Go's RE2 has no lookahead, so
# "PR 490 (https://...)" cannot be excluded by pattern alone. Scripts checking this should drop
# any hit whose LINE already contains a URL, which is how the measurement above was taken.
# Severity is NOT set here. It is set per rule in .vale.ini, which is this repository's
# policy and the single place to change it. A `level:` key in this file would duplicate that
# and drift from it. Flagged by Copilot on
# https://github.com/microbiomedata/nmdc-lakehouse/pull/265.
extends: existence
message: "Bare reference '%s'. Use the full URL and title, not a number the reader has to look up."
nonword: true
tokens:
  - '\b(PR|Pull [Rr]equest|pull request|[Ii]ssue)s? \d{2,}\b'
