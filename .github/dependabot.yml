# Keep routine dependency maintenance predictable and low-noise. Security
# updates are not delayed by cooldowns and are not subject to the version-update
# pull request limits below.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    groups:
      uv-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Leave room for one grouped routine update and up to two major updates.
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
