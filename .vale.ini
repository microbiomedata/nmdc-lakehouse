StylesPath = .github/styles
# error, because CI cannot tolerate anything else. The chain, traced rather than assumed:
#
#   1. Vale's exit code depends only on error-severity alerts. Warnings and suggestions
#      exit 0. (This is also why `just prose-lint` cannot block a commit; see the justfile.)
#   2. Because Vale exits 0, vale-action passes reviewdog `-level=info`. It derives that
#      from Vale's exit code and never reads the workflow's `level:` input at all.
#   3. `-fail-on-error=true` with the `github-pr-annotations` reporter resolves to
#      fail-on-any, not fail-on-error. The error-only behaviour belongs to the
#      `github-check` and `github-pr-check` reporters, which this workflow does not use.
#   4. So any alert Vale prints fails the build, whatever its severity.
#
# Therefore a rule is kept non-blocking by stopping Vale emitting it, not by CI ignoring it.
#
# Evidence, from the failing run on https://github.com/microbiomedata/nmdc-lakehouse/pull/265:
#   /home/runner/reviewdog ... -reporter=github-pr-annotations -fail-on-error=true \
#     -filter-mode=nofilter -level=info
#   196 ##[warning][vale] annotations, 0 ##[error][vale], build failed.
# 196 is exactly the 93 warnings plus 103 suggestions this tree carried at the time.
#
# An earlier version of this comment said the `level` input "labels annotations; it is not a
# threshold". That was wrong twice: it is not a threshold and it labels nothing. The input has
# been removed from the workflow rather than left to mislead the next reader.
MinAlertLevel = error
Vocab = NMDC

[*.md]
BasedOnStyles = Vale, Mark
Vale.Spelling = error
Vale.Terms = NO

# Zero violations in this repository on 2026-08-20, so these cost nothing to enforce today.
Mark.Jargon = error
Mark.ThroatClearing = error

# 75 existing violations. Promote to error once they are cleaned up; until then this reports
# without blocking, so the backlog is visible to whoever is editing the file that contains it.
Mark.EmDash = warning

# 103 hits here, of which roughly 92 sit on lines that already carry a URL. Go's RE2 has no
# lookahead, so the rule cannot exclude them by pattern. Kept at suggestion until it is precise.
Mark.BareRef = suggestion
Mark.BareRefWord = warning

# Fires only on acronyms never expanded in the same file and absent from the vocabulary above.
# The vocabulary was seeded on 2026-08-20 with the domain terms already in use here, so this
# catches new unexplained terms rather than re-litigating the existing ones.
Mark.Undefined = warning
