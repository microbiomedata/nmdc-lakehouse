StylesPath = .github/styles
# error, because CI cannot tolerate anything else. Every link below is pinned to the versions
# CI actually installs, because an unversioned claim about tool behaviour rots silently: an
# earlier version of this comment described a reviewdog that this workflow does not run.
#
#   1. Vale 3.17.1 exits on error-severity alerts alone. Warnings and suggestions exit 0.
#      Measured on this branch: 93 warnings and 103 suggestions, exit 0; one misspelling, exit 1.
#   2. vale-cli/vale-action at 85f9f7f never reads the workflow's `level:` input. It derives
#      reviewdog's flag from Vale's exit code instead. Since Vale exits 0 here, reviewdog gets
#      `-level=info`.
#   3. reviewdog 0.17.0, which that action installs, returns 1 if ANY result is reported when
#      `-fail-on-error=true` is set. Its own flag documentation reads "Returns 1 as exit code if
#      any errors/warnings found in input", and there is no severity test in that path. Later
#      reviewdog versions branch on the reporter; 0.17.0 does not, so the reporter is irrelevant
#      here and nothing below should lean on it.
#   4. Therefore any alert Vale prints fails the build, whatever its severity, and MinAlertLevel
#      is the only lever. A rule is kept non-blocking by stopping Vale emitting it.
#
# The recorded failure outranks all of the above and is the thing to check first if this ever
# looks wrong. From https://github.com/microbiomedata/nmdc-lakehouse/actions/runs/32430670531:
#   Installing ReviewDog version '0.17.0'
#   196 ##[warning][vale] annotations, 0 ##[error][vale]
#   ##[error]Vale and reviewdog exited with status code: 1
# 196 is exactly the 93 warnings plus 103 suggestions this tree carried at the time.
#
# The `level:` input has been removed from the workflow rather than left inert to mislead, which
# it already did twice.
MinAlertLevel = error
Vocab = NMDC

[*.md]
BasedOnStyles = Vale, Mark
Vale.Spelling = error
Vale.Terms = NO

# Zero violations in this repository on 2026-08-20, so these cost nothing to enforce today.
Mark.Jargon = error
Mark.ThroatClearing = error

# 75 existing violations. Promote to error once they are cleaned up; until then this reports
# without blocking, so the backlog is visible to whoever is editing the file that contains it.
Mark.EmDash = warning

# 103 hits here, of which roughly 92 sit on lines that already carry a URL. Go's RE2 has no
# lookahead, so the rule cannot exclude them by pattern. Kept at suggestion until it is precise.
Mark.BareRef = suggestion
Mark.BareRefWord = warning

# Fires only on acronyms never expanded in the same file and absent from the vocabulary above.
# The vocabulary was seeded on 2026-08-20 with the domain terms already in use here, so this
# catches new unexplained terms rather than re-litigating the existing ones.
Mark.Undefined = warning
