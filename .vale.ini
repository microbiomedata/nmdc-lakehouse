StylesPath = .github/styles
# error, because CI cannot tolerate anything else. The Vale action runs with
# filter_mode: nofilter and fail_on_error: true, and reviewdog then fails the build on ANY
# result it receives, whatever its severity. Its `level: error` input labels annotations; it
# is not a threshold. So a warning emitted here is a failed build, and the only way to keep a
# rule non-blocking is to stop Vale emitting it at all.
#
# Authors still see everything: `just prose-lint` passes --minAlertLevel=suggestion explicitly.
# Verified 2026-08-20 by running the Vale command line the action actually invokes. It passes
# no --minAlertLevel flag, so Vale falls back to the MinAlertLevel below. The action's own
# `level: error` input is separate and is handed to reviewdog, not to Vale.
MinAlertLevel = error
Vocab = NMDC

[*.md]
BasedOnStyles = Vale, Mark
Vale.Spelling = error
Vale.Terms = NO

# Zero violations in this repository on 2026-08-20, so these cost nothing to enforce today.
Mark.Jargon = error
Mark.ThroatClearing = error

# 75 existing violations. Promote to error once they are cleaned up; until then this reports
# without blocking, so the backlog is visible to whoever is editing the file that contains it.
Mark.EmDash = warning

# 103 hits here, of which roughly 92 sit on lines that already carry a URL. Go's RE2 has no
# lookahead, so the rule cannot exclude them by pattern. Kept at suggestion until it is precise.
Mark.BareRef = suggestion
Mark.BareRefWord = warning

# Fires only on acronyms never expanded in the same file and absent from the vocabulary above.
# The vocabulary was seeded on 2026-08-20 with the domain terms already in use here, so this
# catches new unexplained terms rather than re-litigating the existing ones.
Mark.Undefined = warning
