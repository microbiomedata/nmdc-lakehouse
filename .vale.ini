StylesPath = .github/styles

# What decides whether a prose alert fails the build. The first line of this block used to begin
# mid-sentence, which is its own small lesson. Every version below is the one CI actually
# installs, because an unversioned claim about tool behaviour rots silently: an earlier version
# of this comment described a reviewdog that this workflow no longer runs.
#
#   1. Vale 3.17.1 exits on error-severity alerts alone. Warnings and suggestions exit 0.
#      Established by measurement, not from the documentation: a tree carrying 93 warnings and
#      103 suggestions exited 0, and adding one misspelling exited 1. Those totals are what the
#      tree held when this was measured and are not a current count; nothing should compare them
#      against a later run.
#   2. CI runs `just prose-lint`, which is the same command a contributor runs. It passes
#      `--minAlertLevel=suggestion` on the command line, which overrides `MinAlertLevel` below,
#      so warnings and suggestions are printed and only an error fails. `just test-prose-lint-exit`
#      asserts both halves of that, and CI runs it.
#   3. So severity decides the build, and MinAlertLevel below decides only what a bare `vale`
#      invocation prints. Keeping it at `error` means a run without the recipe's flag stays quiet
#      rather than noisy; it is no longer what protects the build.
#
# HISTORY, kept because it cost a day and the trap can come back with the tooling. CI used to run
# vale-cli/vale-action at 85f9f7f with `fail_on_error: true`. That action never read the
# workflow's `level:` input, deriving reviewdog's flag from Vale's exit code, and the reviewdog
# 0.17.0 it installed returns 1 if ANY result is reported, with no severity test. Under that
# setup every alert failed the build whatever its severity, MinAlertLevel was the only lever, and
# lowering it was a build failure rather than a louder log. Recorded failure, from
# https://github.com/microbiomedata/nmdc-lakehouse/actions/runs/32430670531:
#   Installing ReviewDog version '0.17.0'
#   196 ##[warning][vale] annotations, 0 ##[error][vale]
#   ##[error]Vale and reviewdog exited with status code: 1
# 196 is exactly the 93 warnings plus 103 suggestions this tree carried at the time. The `level:`
# input was removed rather than left inert to mislead, which it already did twice. None of that
# applies now: the action is gone. If an action is ever reintroduced, all of it applies again.
#
MinAlertLevel = error
Vocab = NMDC

[*.md]
BasedOnStyles = Vale, Mark
Vale.Spelling = error
Vale.Terms = NO

# Zero violations in this repository on 2026-08-20, so these cost nothing to enforce today.
Mark.Jargon = error
Mark.ThroatClearing = error

# Backlog cleared 2026-08-24 and promoted from warning in the same change, which is the sequence
# the rule was landed under: a gate that blocks work its author did not cause gets routed around.
# 101 em dash characters were removed across 11 files, 92 of which Vale saw; the other 9 sat inside
# code fences, which Vale skips, and were fixed by hand from a grep count.
Mark.EmDash = error

# 103 hits here, of which roughly 92 sit on lines that already carry a URL. Go's RE2 has no
# lookahead, so the rule cannot exclude them by pattern. Kept at suggestion until it is precise.
Mark.BareRef = suggestion
Mark.BareRefWord = warning

# Fires only on acronyms never expanded in the same file and absent from the vocabulary above.
# The vocabulary was seeded on 2026-08-20 with the domain terms already in use here, so this
# catches new unexplained terms rather than re-litigating the existing ones.
Mark.Undefined = warning
