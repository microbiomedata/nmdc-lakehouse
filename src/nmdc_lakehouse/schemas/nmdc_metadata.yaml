  PloidyEnum:
    name: PloidyEnum
    description: The ploidy state of an organism's genome, drawn from the ploidy classes
      of the Phenotypic Quality Ontology (PATO).
    notes:
    - 'How this enum was built: each value is a PATO ploidy (PATO:0001374) subclass
      observed in the GOLD field dw_sample_taxonomy_info.ploidy_comments (queried
      2026-04-29), or added to complete the series, with GOLD literal forms as structured
      aliases. Alias `source` URLs cite the public GOLD portal because that field
      is access-restricted. This is the range of the `ploidy` slot, narrowing MIxS
      `ploidy` (MIXS:0000021) from free text.'
    - 'PATO term requests needed before these can become permissible values: octoploid
      (eight homologous sets; PATO''s polyploidy ladder stops at hexaploid) and the
      allopolyploidy subtypes allotetraploid, allohexaploid, and segmental allotetraploid.
      All were observed in GOLD and are recorded here as narrow synonyms of `polyploid`
      / `allopolyploidy` until PATO classes exist. Tracked in https://github.com/pato-ontology/pato/issues/605.'
    - 'Deliberately out of scope: dikaryon / dikaryotic / polykaryotic describe the
      number of nuclei per cell (a fungal life-cycle state), not chromosome-set ploidy,
      and have no PATO ploidy class; if needed they belong in a separate slot. Cytogenetic
      counts (e.g. 2n=38), bare integers, hedged phrases (e.g. "Likely haploid"),
      and free-text identifiers seen in the source field are left to this optional
      slot being unset rather than forced into a value.'
    from_schema: https://w3id.org/nmdc/nmdc
    permissible_values:
      haploid:
        text: haploid
        description: A single set of homologous chromosomes.
        meaning: PATO:0001375
        structured_aliases:
        - literal_form: Haploid
          predicate: EXACT_SYNONYM
          source: https://gold.jgi.doe.gov/
        - literal_form: 1n
          predicate: EXACT_SYNONYM
          source: https://gold.jgi.doe.gov/
        - literal_form: 1N
          predicate: EXACT_SYNONYM
          source: https://gold.jgi.doe.gov/
        - literal_form: haploide
          predicate: EXACT_SYNONYM
          notes:
          - French-language spelling observed in GOLD.
          source: https://gold.jgi.doe.gov/
      diploid:
        text: diploid
        description: Two homologous sets of chromosomes.
        meaning: PATO:0001394
        structured_aliases:
        - literal_form: Diploid
          predicate: EXACT_SYNONYM
          source: https://gold.jgi.doe.gov/
        - literal_form: 2n
          predicate: EXACT_SYNONYM
          source: https://gold.jgi.doe.gov/
        - literal_form: 2N
          predicate: EXACT_SYNONYM
          source: https://gold.jgi.doe.gov/
        - literal_form: 2x
          predicate: EXACT_SYNONYM
          source: https://gold.jgi.doe.gov/
        - literal_form: Diploïde
          predicate: EXACT_SYNONYM
          notes:
          - French-language spelling observed in GOLD.
          source: https://gold.jgi.doe.gov/
      triploid:
        text: triploid
        description: Three homologous sets of chromosomes.
        meaning: PATO:0001381
        structured_aliases:
        - literal_form: Triploid
          predicate: EXACT_SYNONYM
          source: https://gold.jgi.doe.gov/
        - literal_form: 3n
          predicate: EXACT_SYNONYM
          source: https://gold.jgi.doe.gov/
        - literal_form: 3x
          predicate: EXACT_SYNONYM
          source: https://gold.jgi.doe.gov/
      tetraploid:
        text: tetraploid
        description: Four homologous sets of chromosomes.
        meaning: PATO:0001382
        structured_aliases:
        - literal_form: Tetraploid
          predicate: EXACT_SYNONYM
          source: https://gold.jgi.doe.gov/
        - literal_form: tetraploidy
          predicate: EXACT_SYNONYM
          source: https://gold.jgi.doe.gov/
        - literal_form: 4n
          predicate: EXACT_SYNONYM
          source: https://gold.jgi.doe.gov/
        - literal_form: 4x
          predicate: EXACT_SYNONYM
          source: https://gold.jgi.doe.gov/
      pentaploid:
        text: pentaploid
        description: Five homologous sets of chromosomes.
        meaning: PATO:0001383
        notes:
        - Not observed in the 2026-04-29 GOLD snapshot; included so the triploid–hexaploid
          ladder is not arbitrarily gapped.
      hexaploid:
        text: hexaploid
        description: Six homologous sets of chromosomes.
        meaning: PATO:0001384
        structured_aliases:
        - literal_form: Hexaploid
          predicate: EXACT_SYNONYM
          source: https://gold.jgi.doe.gov/
        - literal_form: 6n
          predicate: EXACT_SYNONYM
          source: https://gold.jgi.doe.gov/
        - literal_form: 6x
          predicate: EXACT_SYNONYM
          source: https://gold.jgi.doe.gov/
      polyploid:
        text: polyploid
        description: More than two homologous sets of chromosomes; use a more specific
          value when the level is known.
        meaning: PATO:0001377
        structured_aliases:
        - literal_form: octoploid
          predicate: NARROW_SYNONYM
          notes:
          - Eight homologous sets; observed in GOLD (also as "octaploid", "octapolid").
            No PATO class exists, so it is recorded as a narrow synonym of polyploid
            pending a PATO term request.
          source: https://gold.jgi.doe.gov/
        - literal_form: octaploid
          predicate: NARROW_SYNONYM
          source: https://gold.jgi.doe.gov/
        - literal_form: octapolid
          predicate: NARROW_SYNONYM
          notes:
          - Misspelling of octoploid retained as observed in GOLD.
          source: https://gold.jgi.doe.gov/
      allopolyploidy:
        text: allopolyploidy
        description: Polyploid whose chromosome sets derive from two or more different
          species.
        meaning: PATO:0001379
        structured_aliases:
        - literal_form: Allopolyploid
          predicate: EXACT_SYNONYM
          source: https://gold.jgi.doe.gov/
        - literal_form: Allotetraploid
          predicate: NARROW_SYNONYM
          notes:
          - Allopolyploid at the tetraploid level; observed in GOLD (also "segmental
            allotetraploid"). No PATO class exists, so it is recorded as a narrow
            synonym pending a PATO term request.
          source: https://gold.jgi.doe.gov/
        - literal_form: segmental allotetraploid
          predicate: NARROW_SYNONYM
          source: https://gold.jgi.doe.gov/
        - literal_form: allohexaploid
          predicate: NARROW_SYNONYM
          notes:
          - Allopolyploid at the hexaploid level; observed in GOLD. No PATO class
            exists, so it is recorded as a narrow synonym pending a PATO term request.
          source: https://gold.jgi.doe.gov/
      autopolyploid:
        text: autopolyploid
        description: Polyploid whose chromosome sets derive from a single species.
        meaning: PATO:0001378
        notes:
        - Not observed in the 2026-04-29 GOLD snapshot; included as the origin-counterpart
          of `allopolyploidy`.
      aneuploid:
        text: aneuploid
        description: A chromosome number that is not an exact multiple of the haploid
          set (extra or missing chromosomes).
        meaning: PATO:0001385
