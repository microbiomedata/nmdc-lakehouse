types:
  string:
    name: string
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/nmdc/nmdc
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/nmdc/nmdc
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/nmdc/nmdc
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/nmdc/nmdc
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/nmdc/nmdc
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/nmdc/nmdc
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/nmdc/nmdc
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/nmdc/nmdc
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/nmdc/nmdc
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/nmdc/nmdc
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/nmdc/nmdc
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/nmdc/nmdc
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/nmdc/nmdc
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/nmdc/nmdc
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/nmdc/nmdc
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/nmdc/nmdc
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/nmdc/nmdc
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/nmdc/nmdc
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/nmdc/nmdc
    base: str
    uri: xsd:string
    repr: str
  external_identifier:
    name: external_identifier
    description: A CURIE representing an external identifier
    from_schema: https://w3id.org/nmdc/nmdc
    see_also:
    - https://microbiomedata.github.io/nmdc-schema/identifiers/
    typeof: uriorcurie
    uri: xsd:anyURI
    pattern: ^[a-zA-Z0-9][a-zA-Z0-9_\.]+:[a-zA-Z0-9_][a-zA-Z0-9_\-\/\.,]*$
  bytes:
    name: bytes
    description: An integer value that corresponds to a size in bytes
    from_schema: https://w3id.org/nmdc/nmdc
    see_also:
    - UO:0000233
    base: int
    uri: xsd:long
  decimal_degree:
    name: decimal_degree
    description: A decimal degree expresses latitude or longitude as decimal fractions.
    from_schema: https://w3id.org/nmdc/nmdc
    see_also:
    - https://en.wikipedia.org/wiki/Decimal_degrees
    base: float
    uri: xsd:decimal
  language_code:
    name: language_code
    description: A language code conforming to ISO_639-1
    from_schema: https://w3id.org/nmdc/nmdc
    see_also:
    - https://en.wikipedia.org/wiki/ISO_639-1
    base: str
    uri: xsd:language
enums:
  CalibrationTargetEnum:
    name: CalibrationTargetEnum
    from_schema: https://w3id.org/nmdc/nmdc
    permissible_values:
      mass_charge_ratio:
        text: mass_charge_ratio
        title: m/z
        aliases:
        - Mass
        - m/z
      retention_time:
        text: retention_time
        aliases:
        - RT
      retention_index:
        text: retention_index
        aliases:
        - RI
  CalibrationStandardEnum:
    name: CalibrationStandardEnum
    from_schema: https://w3id.org/nmdc/nmdc
    permissible_values:
      fames:
        text: fames
        aliases:
        - FAMES
      alkanes:
        text: alkanes
        aliases:
        - Alkanes
      srfa:
        text: srfa
        comments:
        - Reference standard Suwannee River Fulvic Acid Standard II (2S101F) from
          International Humic Substances Society
        see_also:
        - https://humic-substances.org/source-materials-for-ihss-samples/
        aliases:
        - Suwannee River fulvic acid
  StrandedOrientationEnum:
    name: StrandedOrientationEnum
    description: This enumeration specifies information about stranded RNA library
      preparations.
    from_schema: https://w3id.org/nmdc/nmdc
    permissible_values:
      antisense orientation:
        text: antisense orientation
        description: Orientation that is complementary (non-coding) to a sequence
          of messenger RNA.
        comments:
        - See https://www.genome.gov/genetics-glossary/antisense
        exact_mappings:
        - SO:0000077
      sense orientation:
        text: sense orientation
        description: Orientation that corresponds to the coding sequence of messenger
          RNA.
  MassSpectrometryAcquisitionStrategyEnum:
    name: MassSpectrometryAcquisitionStrategyEnum
    from_schema: https://w3id.org/nmdc/nmdc
    permissible_values:
      data_independent_acquisition:
        text: data_independent_acquisition
        description: Data independent mass spectrometer acquisition method wherein
          the full mass range is fragmented. Examples of such an approach include
          MS^E, AIF, and bbCID.
        aliases:
        - DIA
        - data independent acquisition from dissociation of full mass range
        exact_mappings:
        - MS:1003227
      data_dependent_acquisition:
