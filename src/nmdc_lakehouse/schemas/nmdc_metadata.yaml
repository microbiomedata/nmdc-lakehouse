  MetadataBadgeEnum:
    name: MetadataBadgeEnum
    description: Metadata-quality badges a Biosample can be awarded. Each permissible
      value names one badge topic and is present or absent; there are no levels or
      tiers. Badges are awarded in two ways. A completeness badge names a badge subset
      (a subset whose in_subset includes badge_topic) and is awarded when the record
      populates at least that subset's badge_minimum_slots slots; a test keeps those
      permissible values and subsets in sync. A provenance badge is awarded from a
      recorded fact about where the metadata came from, has no subset, and names its
      source in its own description.
    from_schema: https://w3id.org/nmdc/nmdc
    see_also:
    - https://github.com/microbiomedata/nmdc-schema/issues/3227
    permissible_values:
      biogeochemistry:
        text: biogeochemistry
        description: Completeness badge. Awarded when the Biosample populates at least
          badge_minimum_slots of the biogeochemistry subset.
      host_information:
        text: host_information
        description: Completeness badge. Awarded when the Biosample populates at least
          badge_minimum_slots of the host_information subset.
      expert_curation:
        text: expert_curation
        description: Provenance badge. Awarded when the Biosample's ProvenanceMetadata.source_system_of_record
          identifies the NMDC submission portal, rather than an ETL process over an
          external database. Not a completeness measure, so it has no badge subset
          and no badge_minimum_slots.
        comments:
        - source_system_of_record is not yet backpopulated for existing biosamples,
          so this badge cannot be awarded on historical records until that backfill
          happens.
  LibraryStrategyEnum:
    name: LibraryStrategyEnum
    description: Sequencing strategy used for library preparation
    comments:
    - NMDC intentionally supports a curated subset of the INSDC library strategy vocabulary.
      The complete controlled vocabulary is defined in the referenced SRA.experiment.xsd;
      values can be added as needed.
    from_schema: https://w3id.org/nmdc/nmdc
    see_also:
    - https://github.com/enasequence/webin-xml/blob/2.1.0/src/main/resources/uk/ac/ebi/ena/sra/schema/SRA.experiment.xsd
    permissible_values:
      WGA:
        text: WGA
        description: Whole genome amplification followed by random sequencing.
        title: Whole Genome Amplification
        see_also:
        - pubmed:1631067
        - pubmed:8962113
      WGS:
        text: WGS
        description: Random sequencing of the whole genome.
        title: Whole Genome Sequencing
        see_also:
        - pubmed:10731132
      RNA-Seq:
        text: RNA-Seq
        description: Random sequencing of whole transcriptome
        see_also:
        - pubmed:18611170
        aliases:
        - Whole Transcriptome Shotgun Sequencing
        - WTSS
      AMPLICON:
        text: AMPLICON
        description: Sequencing of overlapping or distinct PCR or RT-PCR products
        comments:
        - metagenomic community profiling using SSU rRNA, for example
