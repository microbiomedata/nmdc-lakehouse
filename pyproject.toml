[project]
name = "nmdc-lakehouse"
version = "0.0.0"
description = "Schema-directed ETL from NMDC MongoDB to local Parquet artifacts for lakehouse publication."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Sierra Moxon", email = "smoxon@lbl.gov" },
]
keywords = ["nmdc", "linkml", "linkml-store", "etl", "lakehouse", "parquet", "iceberg", "mongodb", "postgres"]

dependencies = [
    # Core LinkML data access
    # [all] brings in LinkML transitively. Explicit matching floors for the
    # generator and runtime keep their APIs aligned and avoid known
    # version-skew breakage (see linkml/linkml#3241 and linkml/linkml#3183).
    "linkml-store[all]>=0.3.2",
    "linkml>=1.11.1",
    "linkml-runtime>=1.11.1",
    "nmdc-schema",
    # Database drivers (linkml-store routes through these)
    "pymongo>=4.9",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2.0.51",
    # Lakehouse output formats
    "pyarrow>=16.0",
    "pyiceberg>=0.7",
    "duckdb>=1.5.5",
    "pandas>=2.2",
    # HTTP (used by notebooks/fetch_taxonomy_summaries.ipynb and future NERSC loaders)
    "requests>=2.34.2",
    # Job / CLI scaffolding
    "click>=8.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0",
    "tqdm>=4.70.0",
    # Used by scripts/python/ (copied from external-metadata-awareness)
    "oaklib>=0.7.4",
    "python-dotenv>=1.0",
    # Used by notebooks/fetch_*.ipynb retry logic and scripts/download_to_cache.py
    "tenacity>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=5.0",
    "mongomock>=4.3",
    "deptry>=0.25.1",
    "ruff>=0.16.2",
    "mypy>=1.10",
    "pre-commit>=4.6.2",
    "shellcheck-py==0.11.0.1",
    "types-PyYAML>=6.0.12.20260408",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[project.scripts]
# Primary entry point. May be replaced by a richer job runner later.
nmdc-lakehouse = "nmdc_lakehouse.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nmdc_lakehouse"]

# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------
[tool.uv]
# uv enforces this requirement itself at runtime and exits when it is unmet.
required-version = ">=0.12.3"
# Dev dependencies are managed through the `dev` extra above. Ordinary setup
# uses `uv sync --locked --extra dev`; lock refreshes remain explicit.

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# Ruff 0.16 expanded its defaults from 59 to 413 rules. Keep this repository's
# existing, intentional rule families explicit instead of inheriting defaults
# that change when the linter is upgraded.
select = [
    "B",  # bugbear
    "D",  # pydocstyle
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "I",  # isort
    "W",  # Warning
]
extend-ignore = [
    "D203",  # one-blank-line-before-class
    "D213",  # multi-line-summary-second-line
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.deptry]
known_first_party = ["mongodb_connection", "nmdc_lakehouse"]
optional_dependencies_dev_groups = ["dev", "docs"]

[tool.deptry.per_rule_ignores]
# These modules are supplied by the authenticated BERDL environment rather
# than PyPI. Their imports are guarded so local and CI checks remain usable.
DEP001 = ["berdl_notebook_utils", "data_lakehouse_ingest"]
# These packages provide optional backends or constrain transitive LinkML APIs;
# they are intentional even though this repository does not import them.
DEP002 = ["linkml", "psycopg", "pyiceberg", "sqlalchemy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a live MongoDB or PostgreSQL instance (set ENABLE_DB_TESTS=true)",
    "slow: long running tests",
]

[tool.coverage.report]
fail_under = 71.462
precision = 3
show_missing = true

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
ignore_missing_imports = true
